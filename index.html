<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TalentScreen · Resume Classification & Job Matching</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0c0c0e;--side:#0f0f11;--c:#161619;--c2:#1a1a1e;--in:#101013;--b:#2a2a30;--o:#ffa94d;--o2:#ff7a1a;--t:#f3f3f3;--m:#9b9ba5;--g:#3ecf8e;--r:#ff5c5c;--chip:#222227;--btn:#26262b}
[data-theme=light]{--bg:#f5f5f7;--side:#fff;--c:#fff;--c2:#f1f1f4;--in:#fff;--b:#dcdce2;--o:#d9680a;--o2:#ff7a1a;--t:#17171a;--m:#62626c;--g:#0f9d63;--r:#d93636;--chip:#eeeef2;--btn:#e8e8ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:14px/1.5 Manrope,system-ui,sans-serif;display:flex;min-height:100vh}
aside{width:236px;background:var(--side);border-right:1px solid var(--b);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0;z-index:7}
.logo{font-weight:800;font-size:18px;padding:4px 10px 18px}.logo b{color:var(--o)}
nav a{display:flex;gap:10px;padding:9px 12px;margin:2px 0;border-radius:10px;color:var(--m);text-decoration:none;cursor:pointer;transition:.15s}
nav a:hover{background:var(--c2);color:var(--t)}nav a.on{background:rgba(255,169,77,.14);color:var(--o);box-shadow:inset 3px 0 var(--o)}
.wrapper{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;gap:10px;align-items:center;padding:12px 30px;border-bottom:1px solid var(--b);position:sticky;top:0;background:var(--bg);z-index:6}
header input{max-width:380px}#mn{display:none}#usr{color:var(--m);margin-left:auto;white-space:nowrap}
main{flex:1;min-width:0;padding:26px 30px}
.hero{border-radius:16px;padding:26px 28px;margin-bottom:22px;border:1px solid var(--b);background:radial-gradient(circle at 85% 20%,rgba(255,122,26,.3),transparent 55%),var(--c)}
h1{margin:0 0 4px;font-size:26px;font-weight:800}h3{margin:0 0 12px;font-size:15px}.sub{color:var(--m);margin:0}.kl{color:var(--m);font-size:12px}
.grid{display:grid;gap:16px;margin-bottom:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:18px;transition:.2s}.card:hover{border-color:#4a3a28;box-shadow:0 0 24px rgba(255,140,40,.08)}
.k{font-size:30px;font-weight:800;color:var(--o)}
table{width:100%;border-collapse:collapse}th{color:var(--m);text-align:left;font-weight:600;font-size:12px;padding:8px;border-bottom:1px solid var(--b)}th.s{cursor:pointer}th.s:hover{color:var(--o)}
td{padding:10px 8px;border-bottom:1px solid var(--b);vertical-align:top}tr:hover td{background:var(--c2)}.wrap{overflow-x:auto}
.btn{background:linear-gradient(135deg,var(--o),var(--o2));color:#1a1000;border:0;border-radius:10px;padding:9px 16px;font:700 13px Manrope;cursor:pointer;transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(255,140,40,.3)}.btn.s{background:var(--btn);color:var(--t);padding:7px 12px}.btn.s:hover{box-shadow:none}
.btn:disabled{opacity:.5;cursor:wait}
input,select,textarea{background:var(--in);border:1px solid var(--b);color:var(--t);border-radius:9px;padding:9px 11px;font:inherit;width:100%}
input[type=checkbox]{width:auto}input:focus,select:focus,textarea:focus,.btn:focus-visible,a:focus-visible{outline:2px solid var(--o);border-color:transparent}label{display:block;color:var(--m);font-size:12px;margin:10px 0 4px}
.bd{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--btn)}
.ok{background:rgba(62,207,142,.15);color:var(--g)}.no{background:rgba(255,92,92,.14);color:var(--r)}.wt{background:rgba(255,169,77,.15);color:var(--o)}
.chip{display:inline-block;margin:2px;padding:3px 10px;border-radius:8px;font-size:12px;background:var(--chip)}.chip.y{color:var(--g)}.chip.n{color:var(--r)}
.bar{height:8px;border-radius:9px;background:var(--btn);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--o2));transition:width .4s}
.drop{border:2px dashed #4a3a28;border-radius:14px;padding:34px;text-align:center;color:var(--m);cursor:pointer;transition:.2s}.drop.h,.drop:hover{border-color:var(--o);background:rgba(255,169,77,.06)}
.empty{text-align:center;padding:40px;color:var(--m)}.empty b{display:block;color:var(--t);font-size:16px;margin-bottom:6px}
.step{border-left:3px solid var(--o);padding:8px 14px;margin:10px 0;background:var(--c2);border-radius:0 10px 10px 0;word-break:break-word}.step small{color:var(--o);font-weight:700}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:130px}
mark{background:rgba(255,169,77,.3);color:inherit;border-radius:3px;padding:0 2px}
#toast{position:fixed;right:20px;bottom:20px;z-index:20}#toast div{background:var(--c);border:1px solid var(--b);border-left:4px solid var(--g);padding:11px 16px;border-radius:10px;margin-top:8px;box-shadow:0 8px 24px #0006}#toast .e{border-left-color:var(--r)}
#modal{position:fixed;inset:0;background:#000c;display:none;place-items:center;z-index:15;padding:20px}#modal>div{max-width:720px;max-height:80vh;overflow:auto;width:100%}
#login{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;z-index:30;padding:20px}#login .card{width:100%;max-width:360px}
.sp{display:inline-block;width:14px;height:14px;border:2px solid #0004;border-top-color:#000;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}@keyframes r{to{transform:rotate(360deg)}}
@media(max-width:860px){aside{position:fixed;left:0;top:0;transform:translateX(-100%);transition:.2s}body.nv aside{transform:none;box-shadow:0 0 0 100vmax #0008}#mn{display:block}header{padding:10px 14px}main{padding:16px}}
@media print{aside,header,.btn,#toast{display:none!important}body{background:#fff;color:#000}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<aside><div class="logo">Talent<b>Screen</b></div><nav id="nav"></nav></aside>
<div class="wrapper"><header><button class="btn s" id="mn" aria-label="Menu" onclick="document.body.classList.toggle('nv')">☰</button>
<input id="gs" type="search" placeholder="Search candidates, skills, email… (Enter)" onkeydown="if(event.key=='Enter')gsearch(this.value)">
<span id="usr"></span><button class="btn s" title="Toggle theme" onclick="theme()">◐</button><button class="btn s" onclick="logout()">Logout</button></header>
<main id="app"></main></div><div id="toast"></div>
<div id="modal" onclick="if(event.target==this)this.style.display='none'"><div class="card" id="mb"></div></div>
<div id="login"><div class="card"><div class="logo" style="padding-bottom:6px">Talent<b>Screen</b></div><p class="sub">Sign in with your database account</p>
<label for="lu">Username</label><input id="lu" autocomplete="username"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()">
<p id="le" style="color:var(--r);min-height:22px;margin:8px 0"></p><button class="btn" style="width:100%" onclick="doLogin()">Sign in</button></div></div>
<script>
const $=s=>document.querySelector(s),E=x=>(x??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const NAV=[['dashboard','▦','Dashboard'],['screening','⇪','Resume Screening'],['jd','✎','Job Description'],['classification','◈','Resume Classification'],['ranking','☰','Candidate Ranking'],['board','▤','Shortlist Board'],['compare','⇄','Compare Candidates'],['candidate','☺','Candidate Details'],['skills','✦','Skills Analysis'],['nlp','⌘','NLP Analysis'],['analytics','◔','Analytics'],['reports','⎙','Reports'],['settings','⚙','Settings']];
const L={Shortlisted:'Shortlist','On Hold':'Hold',Rejected:'Reject'},COLS=['Shortlisted','On Hold','Rejected'];
let D={resumes:[],jds:[],settings:{},metrics:{},log:[],user:null},F={},SEL=null,SORT='score',Q=[],CH=[],BUSY=0,AUTO=true,CMP=[],RS='';
if(localStorage.ts_theme)document.documentElement.dataset.theme=localStorage.ts_theme;
function theme(){const t=document.documentElement.dataset.theme=='light'?'dark':'light';document.documentElement.dataset.theme=t;localStorage.ts_theme=t}
const showLogin=()=>{D.user=null;$('#login').style.display='grid'};
const api=async(u,o)=>{const r=await fetch(u,o);if(r.status==401){showLogin();throw new Error('auth')}return r.json()},post=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
const R=()=>D.resumes.filter(r=>r.res),cnt=a=>a.reduce((o,k)=>(o[k]=(o[k]||0)+1,o),{}),topN=(o,n=8)=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,n);
const JD=()=>D.jds.find(j=>j.id==D.jd_id)||{title:'—'};
function toast(m,ok=1){const d=document.createElement('div');d.textContent=m;if(!ok)d.className='e';$('#toast').append(d);setTimeout(()=>d.remove(),3200)}
async function load(){try{D=await api('/api/state');$('#login').style.display='none';$('#usr').textContent='👤 '+D.user;render()}catch(e){if(e.message!='auth')toast('Could not reach the server',0)}}
async function doLogin(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#lu').value,password:$('#lp').value})}),j=await r.json();
if(!j.ok){$('#le').textContent=j.error||'Login failed';return}$('#lp').value='';$('#le').textContent='';load()}
async function logout(){await fetch('/api/logout',{method:'POST'});showLogin()}
const pg=()=>(location.hash.slice(1)||'dashboard');
function gsearch(v){F.q=v;if(pg()=='ranking')render();else location.hash='ranking'}
function render(){if(!D.user)return;const p=pg();document.body.classList.remove('nv');$('#nav').innerHTML=NAV.map(n=>`<a class="${n[0]==p?'on':''}" href="#${n[0]}"><span>${n[1]}</span>${n[2]}</a>`).join('');
CH.forEach(c=>c.destroy());CH=[];Q=[];const t=NAV.find(n=>n[0]==p)||NAV[0];
$('#app').innerHTML=`<div class="hero"><h1>${t[2]}</h1><p class="sub">Active job: <b style="color:var(--o)">${E(JD().title)}</b> · match scores are system-generated estimates, not hiring decisions.</p></div>`+(P[p]||P.dashboard)();Q.forEach(f=>f())}
addEventListener('hashchange',render);
const empty=(t,s)=>`<div class="card empty"><b>${t}</b>${s} <a href="#screening" style="color:var(--o)">Go to Resume Screening</a></div>`;
const kpi=(l,v,tip)=>`<div class="card" title="${tip||''}"><div class="k">${v}</div><div class="kl">${l}</div></div>`;
const badge=s=>`<span class="bd ${s=='Shortlisted'||s=='Processed'||s=='Extracted'?'ok':s=='Rejected'||/OCR|fail|Unsup|Skipped/.test(s)?'no':'wt'}">${E(s)}</span>`;
const bar=v=>`<div class="bar"><i style="width:${v}%"></i></div>`,chips=(a,c='')=>a.map(s=>`<span class="chip ${c}">${c=='y'?'✓ ':c=='n'?'✕ ':''}${E(s)}</span>`).join('')||'<span class="sub">None</span>';
const link=r=>`<a href="#candidate" style="color:var(--o)" onclick="SEL='${r.id}'">${E(r.res.name)}</a>`;
function chart(id,type,labels,data,title){Q.push(()=>{const el=document.getElementById(id);if(!el)return;CH.push(new Chart(el,{type,data:{labels,datasets:[{label:title,data,borderRadius:6,backgroundColor:['#ffa94d','#ff7a1a','#ffd8a8','#c76a1e','#8a4a14','#ffc078','#e8590c','#f4a261'],borderColor:'#161619'}]},options:{plugins:{legend:{display:/pie|doughnut/.test(type),labels:{color:'#999'}}},scales:/pie|doughnut/.test(type)?{}:{x:{ticks:{color:'#9b9ba5'},grid:{display:0}},y:{ticks:{color:'#9b9ba5',precision:0},grid:{color:'#8883'},beginAtZero:true}}}}))})}
const cv=(id,t)=>`<div class="card"><h3>${t}</h3><canvas id="${id}" height="170"></canvas></div>`;
function stats(){const rs=R(),n=rs.length,sc=rs.map(r=>r.res.score??0),c=s=>rs.filter(r=>r.res.status==s).length;return{rs,n,sh:c('Shortlisted'),hd:c('On Hold'),rj:c('Rejected'),avg:n?Math.round(sc.reduce((a,b)=>a+b,0)/n):0,cats:cnt(rs.map(r=>r.res.category)),sk:cnt(rs.flatMap(r=>r.res.skills)),
bins:[0,1,2,3,4].map(i=>sc.filter(s=>s>=i*20&&(s<(i+1)*20||i==4)).length)}}
const P={
dashboard(){const s=stats();if(!s.n&&!D.resumes.length)return empty('No resumes yet','Upload resumes to see screening insights.');
chart('c1','bar',['0-20','20-40','40-60','60-80','80-100'],s.bins,'Candidates');chart('c2','doughnut',Object.keys(s.cats),Object.values(s.cats));chart('c3','bar',topN(s.sk).map(x=>x[0]),topN(s.sk).map(x=>x[1]),'Candidates with skill');chart('c4','pie',COLS,[s.sh,s.hd,s.rj]);
const top=[...s.rs].sort((a,b)=>b.res.score-a.res.score).slice(0,5);
return `<div class="grid g4">${kpi('Resumes uploaded',D.resumes.length)}${kpi('Processed',s.n)}${kpi('Shortlisted',s.sh)}${kpi('On hold',s.hd)}${kpi('Rejected',s.rj)}${kpi('Average match score',s.avg+'%')}${kpi('Top category',E((topN(s.cats,1)[0]||['—'])[0]).replace(/^(.{14}).+/,'$1…'))}</div>
<div class="grid g2">${cv('c1','Candidate score distribution')}${cv('c2','Job category distribution')}${cv('c3','Skills frequency')}${cv('c4','Shortlisted · on hold · rejected')}</div>
<div class="grid g2"><div class="card"><h3>Top candidates</h3>${top.map(r=>`<div class="row" style="align-items:center;margin-bottom:8px"><div style="flex:2">${link(r)}</div><div style="flex:2">${bar(r.res.score)}</div><b style="flex:0 0 52px">${r.res.score}%</b></div>`).join('')||'<span class="sub">Process resumes to see ranking.</span>'}</div>
<div class="card"><h3>Processing status</h3>${bar(D.resumes.length?s.n/D.resumes.length*100:0)}<p class="sub">${s.n} of ${D.resumes.length} resumes processed</p><h3>Recent activity</h3>${D.log.slice(0,6).map(l=>`<div>• ${E(l)}</div>`).join('')||'<span class="sub">Nothing yet.</span>'}</div></div>`},
screening(){Q.push(()=>{const d=$('#drop');d.ondragover=e=>{e.preventDefault();d.classList.add('h')};d.ondragleave=()=>d.classList.remove('h');d.ondrop=e=>{e.preventDefault();d.classList.remove('h');up(e.dataTransfer.files)}});
return `<div class="drop" id="drop" onclick="$('#fi').click()"><b style="color:var(--t);font-size:16px">Drop resumes here or click to browse</b><br>PDF, DOCX or TXT · upload as many as you need<input id="fi" type="file" multiple accept=".pdf,.docx,.txt" hidden onchange="up(this.files);this.value=''"></div>
<div class="card" style="margin-top:16px"><div class="row" style="justify-content:space-between;margin-bottom:10px;align-items:center"><h3 style="margin:0;flex:3">Uploaded resumes (${D.resumes.length})</h3><label style="margin:0;flex:2"><input type="checkbox" ${AUTO?'checked':''} onchange="AUTO=this.checked"> Auto-process after upload</label><button class="btn s" onclick="procAll(1)">Reprocess all</button><button class="btn" id="pa" onclick="procAll()">${BUSY?'<span class="sp"></span> Processing…':'Process pending'}</button></div><div class="bar" id="pb" style="margin-bottom:12px"><i style="width:0"></i></div>
${D.resumes.length?`<div class="wrap"><table><tr><th>Resume<th>Format<th>Size<th>Extraction<th>Processing<th>Action</tr>${D.resumes.map(r=>`<tr><td>${E(r.name)}<td>${E(r.fmt)}<td>${(r.size/1024).toFixed(1)} KB<td>${badge(r.ext)}<td>${badge(r.proc_status)}<td><button class="btn s" onclick="view('${r.id}')">View</button> <button class="btn s" onclick="del('${r.id}')">Remove</button></tr>`).join('')}</table></div>`:'<div class="empty"><b>No files yet</b>Add resumes above to begin screening.</div>'}</div>`},
jd(){return `<div class="grid g2"><div class="card"><h3>Create a job description</h3><label>Job title</label><input id="jt" placeholder="Python Developer"><label>Description (paste or upload)</label><textarea id="jx" rows="6"></textarea><input type="file" accept=".pdf,.docx,.txt" onchange="jfile(this.files[0])" style="margin-top:6px">
<div class="row"><div><label>Required skills</label><input id="jr" placeholder="Python, SQL, Flask, Git"></div><div><label>Preferred skills</label><input id="jp" placeholder="AWS, Docker"></div><div><label>Min. experience (yrs)</label><input id="je" type="number" value="1" min="0"></div></div><br><button class="btn" onclick="saveJD()">Save and select</button></div>
<div class="card"><h3>Saved job descriptions</h3>${D.jds.map(x=>`<div class="card" style="margin-bottom:10px;${x.id==D.jd_id?'border-color:var(--o)':''}"><b>${E(x.title)}</b> ${x.id==D.jd_id?'<span class="bd wt">Selected</span>':''}<div class="sub">${E(x.text.slice(0,110))}…</div><div>${chips(x.required,'y')}<span class="chip">min ${x.min_exp} yr</span></div><br><button class="btn s" onclick="selJD('${x.id}')">Use this job</button> <button class="btn s" onclick="delJD('${x.id}')">Delete</button></div>`).join('')}</div></div>`},
classification(){const rs=R();if(!rs.length)return empty('Nothing classified yet','Process resumes to see predicted categories.');const m=D.metrics;
return `<div class="card"><h3>Predicted job categories</h3><div class="wrap"><table><tr><th>Candidate<th>Predicted category<th>Confidence<th>Top 3 predictions</tr>${rs.map(r=>`<tr><td>${link(r)}<td><span class="bd wt">${E(r.res.category)}</span><td style="width:170px">${Math.round(r.res.conf*100)}%${bar(r.res.conf*100)}<td>${r.res.top.map(t=>`${E(t[0])} ${Math.round(t[1]*100)}%`).join(' · ')}</tr>`).join('')}</table></div></div>
<div class="card" style="margin-top:16px"><h3>Model: TF-IDF + Logistic Regression</h3>Hold-out accuracy <b>${m.accuracy}</b> · macro F1 <b>${m.f1_macro}</b> · ${m.samples} training documents<p class="sub">${E(m.source)}</p></div>`},
ranking(){const rs=R();if(!rs.length)return empty('No candidates to rank','Process resumes first.');const cats=[...new Set(rs.map(r=>r.res.category))],q=(F.q||'').toLowerCase();
let l=rs.filter(r=>{const x=r.res;return x.score>=(+F.ms||0)&&(!F.cat||x.category==F.cat)&&x.exp>=(+F.ex||0)&&(!F.sk||x.skills.some(s=>s.includes(F.sk.toLowerCase())))&&(!F.st||x.status==F.st)&&(!q||[x.name,x.email,x.category,...x.skills].join(' ').toLowerCase().includes(q))});
l.sort((a,b)=>SORT=='name'?a.res.name.localeCompare(b.res.name):SORT=='exp'?b.res.exp-a.res.exp:b.res.score-a.res.score);
const th=(k,t)=>`<th class="s" onclick="SORT='${k}';render()">${t}${SORT==k?' ▾':''}`;
return `<div class="card"><div class="row"><div><label>Search</label><input value="${E(F.q||'')}" onchange="F.q=this.value;render()"></div><div><label>Min score</label><input type="number" value="${F.ms||''}" onchange="F.ms=this.value;render()"></div><div><label>Category</label><select onchange="F.cat=this.value;render()"><option value="">All</option>${cats.map(c=>`<option ${F.cat==c?'selected':''}>${E(c)}</option>`).join('')}</select></div><div><label>Min experience</label><input type="number" value="${F.ex||''}" onchange="F.ex=this.value;render()"></div><div><label>Skill contains</label><input value="${E(F.sk||'')}" onchange="F.sk=this.value;render()"></div><div><label>Status</label><select onchange="F.st=this.value;render()"><option value="">All</option>${COLS.map(c=>`<option ${F.st==c?'selected':''}>${c}</option>`).join('')}</select></div><div style="flex:0"><button class="btn s" onclick="F={};render()">Clear</button></div></div></div>
<div class="card wrap" style="margin-top:16px"><table><tr><th>Rank${th('name','Candidate')}<th>Category${th('score','Match score')}${th('exp','Experience')}<th>Skills<th>Status<th></tr>${l.map((r,i)=>`<tr><td>${i+1}<td>${link(r)}${r.res.dup?' <span class="bd no" title="Same email as another resume">duplicate?</span>':''}<td>${E(r.res.category)}<td style="width:150px"><b>${r.res.score}%</b>${bar(r.res.score)}<td>${r.res.exp} yrs<td>${r.res.matched.length}/${r.res.req_n}<td>${badge(r.res.status)}<td><button class="btn s" onclick="cmpAdd('${r.id}')">Compare</button></tr>`).join('')||'<tr><td colspan=8 class="empty">No candidates match these filters.</tr>'}</table></div>`},
board(){const rs=R();if(!rs.length)return empty('No candidates yet','Process resumes first.');
return `<p class="sub" style="margin-bottom:12px">Move candidates between columns to record your own decision. It overrides the automatic status and survives re-scoring.</p><div class="grid g3">${COLS.map(c=>{const l=rs.filter(r=>r.res.status==c).sort((a,b)=>b.res.score-a.res.score);
return `<div class="card"><h3>${c} <span class="bd">${l.length}</span></h3>${l.map(r=>`<div class="card" style="margin-bottom:10px;background:var(--c2)"><b>${link(r)}</b> <span class="kl">${r.res.score}% · ${E(r.res.category)}</span>${bar(r.res.score)}<div style="margin-top:8px">${COLS.filter(x=>x!=c).map(x=>`<button class="btn s" onclick="decide('${r.id}','${x}')">${L[x]}</button>`).join(' ')}${r.res.decision?` <button class="btn s" onclick="decide('${r.id}','')" title="Back to automatic status">Auto</button>`:''}</div></div>`).join('')||'<span class="sub">Empty</span>'}</div>`}).join('')}</div>`},
compare(){const rs=R();if(rs.length<2)return empty('Need at least two processed candidates','Process more resumes to compare.');
if(!CMP.length)CMP=rs.slice(0,3).map(r=>r.id);const sel=CMP.map(id=>rs.find(r=>r.id==id)).filter(Boolean),best=Math.max(0,...sel.map(r=>r.res.score));
const row=(l,f)=>`<tr><th>${l}${sel.map(r=>`<td>${f(r.res)}`).join('')}</tr>`;
return `<div class="card"><div class="row">${[0,1,2].map(i=>`<div><label>Candidate ${i+1}</label><select onchange="CMP[${i}]=this.value;render()"><option value="">—</option>${rs.map(y=>`<option value="${y.id}" ${CMP[i]==y.id?'selected':''}>${E(y.res.name)}</option>`).join('')}</select></div>`).join('')}</div></div>
<div class="card wrap" style="margin-top:16px"><table><tr><th>${sel.map(r=>`<th>${link(r)}`).join('')}</tr>${row('Match score',x=>`<b style="${x.score==best?'color:var(--g)':''}">${x.score}%${x.score==best?' ★':''}</b>${bar(x.score)}`)}${row('Status',x=>badge(x.status))}${row('Category',x=>E(x.category))}${row('Experience',x=>x.exp+' yrs'+(x.exp_ok?'':' <span class="bd no">below min</span>'))}${row('Required skills',x=>`${x.matched.length}/${x.req_n}`)}${row('Matched',x=>chips(x.matched,'y'))}${row('Missing',x=>chips(x.missing,'n'))}${row('Education',x=>E(x.degree||'—')+'<br><span class="sub">'+E(x.college||'')+'</span>')}${row('Contact',x=>E(x.email||'—'))}</table></div>`},
candidate(){const rs=R();if(!rs.length)return empty('No candidate selected','Process resumes first.');const r=rs.find(x=>x.id==SEL)||rs[0],x=r.res;
return `<select onchange="SEL=this.value;render()" style="max-width:340px;margin-bottom:16px">${rs.map(y=>`<option value="${y.id}" ${y.id==r.id?'selected':''}>${E(y.res.name)}</option>`).join('')}</select>
<div class="grid g2"><div class="card"><h3>${E(x.name)} ${badge(x.status)} ${x.dup?'<span class="bd no">possible duplicate</span>':''}</h3><div class="k">${x.score}% <span class="kl">system match score</span></div>${bar(x.score)}<p class="sub">Text similarity ${Math.round(x.sim*100)}% · required skill coverage ${Math.round(x.cov*100)}% · experience ${x.exp_ok?'meets':'below'} minimum</p><p>Email: ${E(x.email||'—')}<br>Phone: ${E(x.phone||'—')}<br>Location: ${E(x.location||'—')}</p><p>Predicted category: <span class="bd wt">${E(x.category)}</span> (${Math.round(x.conf*100)}%)</p><button class="btn s" onclick="view('${r.id}')">View resume text</button></div>
<div class="card"><h3>Education & experience</h3><p>Degree: ${E(x.degree||'—')}<br>Institution: ${E(x.college||'—')}<br>Graduation: ${E(x.grad_year||'—')} · CGPA/%: ${E(x.gpa||'—')}</p><p>Experience: ${x.exp} yrs · internships mentioned: ${x.interns}<br>Titles: ${E(x.titles.join(', ')||'—')}</p><p>Companies: ${E(x.companies.join(' | ')||'—')}</p></div></div>
<div class="grid g2"><div class="card"><h3>Your decision</h3>${COLS.map(c=>`<button class="btn ${x.status==c?'':'s'}" onclick="decide('${r.id}','${c}')">${L[c]}</button>`).join(' ')} ${x.decision?`<button class="btn s" onclick="decide('${r.id}','')">Reset to auto (${E(x.auto||'')})</button>`:''}<label>Recruiter notes</label><textarea id="nt" rows="4" maxlength="1000">${E(x.notes||'')}</textarea><br><br><button class="btn s" onclick="note('${r.id}')">Save note</button></div>
<div class="card"><h3>Best-fit jobs</h3>${(x.fits||[]).map(f=>`<div class="row" style="align-items:center;margin-bottom:6px"><div style="flex:2">${E(f[0])}</div><div style="flex:2">${bar(f[1])}</div><b style="flex:0 0 52px">${f[1]}%</b></div>`).join('')}</div></div>
<div class="grid g2"><div class="card"><h3>Skill match</h3>${chips(x.matched,'y')}${chips(x.missing,'n')}<h3 style="margin-top:14px">Additional skills</h3>${chips(x.extra)}</div>
<div class="card"><h3>Certifications</h3>${x.certs.map(c=>`<div>• ${E(c)}</div>`).join('')||'<span class="sub">None found</span>'}<h3 style="margin-top:14px">Projects</h3>${x.projects.map(c=>`<div>• ${E(c)}</div>`).join('')||'<span class="sub">None found</span>'}</div></div>`},
skills(){const s=stats();if(!s.n)return empty('No skill data','Process resumes first.');chart('s1','bar',topN(s.sk,12).map(x=>x[0]),topN(s.sk,12).map(x=>x[1]),'Candidates');
const miss=cnt(s.rs.flatMap(r=>r.res.missing));chart('s2','bar',topN(miss,12).map(x=>x[0]),topN(miss,12).map(x=>x[1]),'Candidates missing');
return `<div class="grid g2">${cv('s1','Most common candidate skills')}${cv('s2','Most common skill gaps for this job')}</div><div class="card wrap"><table><tr><th>Candidate<th>Matched<th>Missing<th>Additional</tr>${s.rs.map(r=>`<tr><td>${link(r)}<td>${chips(r.res.matched,'y')}<td>${chips(r.res.missing,'n')}<td>${chips(r.res.extra.slice(0,6))}</tr>`).join('')}</table></div>`},
nlp(){const rs=R();if(!rs.length)return empty('No NLP output yet','Process resumes first.');const r=rs.find(x=>x.id==SEL)||rs[0],p=r.res.pre;
return `<select onchange="SEL=this.value;render()" style="max-width:340px;margin-bottom:8px">${rs.map(y=>`<option value="${y.id}" ${y.id==r.id?'selected':''}>${E(y.res.name)}</option>`).join('')}</select>`+
[['1 · Original text',p.original],['2 · Cleaned text (lowercase, symbols removed)',p.cleaned],['3 · Tokens',p.tokens.join(' | ')],['4 · After stop-word removal',p.nostop.join(' | ')],['5 · After lemmatization',p.lemmas.join(' | ')],['6 · Processed text (used by the model)',p.processed.slice(0,500)]].map(s=>`<div class="step"><small>${s[0]}</small><br>${E(s[1])||'—'}</div>`).join('<div style="text-align:center;color:var(--o)">↓</div>')},
analytics(){const s=stats();if(!s.n)return empty('No analytics yet','Process resumes first.');
chart('a1','bar',Object.keys(s.cats),Object.values(s.cats),'Resumes');chart('a2','bar',s.rs.map(r=>r.res.name.slice(0,14)),s.rs.map(r=>r.res.score),'Match %');chart('a3','bar',s.rs.map(r=>r.res.name.slice(0,14)),s.rs.map(r=>r.res.exp),'Years');chart('a4','doughnut',['Processed','Pending/skipped'],[s.n,D.resumes.length-s.n]);
return `<div class="grid g4">${kpi('Shortlist rate',Math.round(s.sh/s.n*100)+'%')}${kpi('Average score',s.avg+'%')}${kpi('Highest score',Math.max(...s.rs.map(r=>r.res.score))+'%')}${kpi('Avg experience',(s.rs.reduce((a,r)=>a+r.res.exp,0)/s.n).toFixed(1)+' yrs')}</div><div class="grid g2">${cv('a1','Resumes per category')}${cv('a2','Match score by candidate')}${cv('a3','Experience by candidate')}${cv('a4','Processing statistics')}</div>`},
reports(){const rs=R().filter(r=>!RS||r.res.status==RS).sort((a,b)=>b.res.score-a.res.score);return `<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h3 style="flex:3;margin:0">Screening report · ${E(JD().title)}</h3><select style="max-width:170px" onchange="RS=this.value;render()"><option value="">All statuses</option>${COLS.map(c=>`<option ${RS==c?'selected':''}>${c}</option>`).join('')}</select><a class="btn" style="text-decoration:none;text-align:center" href="/api/report.csv?status=${encodeURIComponent(RS)}" download>Download CSV</a><button class="btn s" onclick="print()">Print</button></div><br>${rs.length?`<div class="wrap"><table><tr><th>#<th>Candidate<th>Category<th>Score<th>Missing skills<th>Status<th>Notes</tr>${rs.map((r,i)=>`<tr><td>${i+1}<td>${E(r.res.name)}<td>${E(r.res.category)}<td>${r.res.score}%<td>${E(r.res.missing.join(', ')||'—')}<td>${badge(r.res.status)}<td>${E(r.res.notes||'')}</tr>`).join('')}</table></div>`:'<div class="empty"><b>No report data</b>Process resumes first.</div>'}</div>`},
settings(){const s=D.settings;return `<div class="grid g2"><div class="card"><h3>Match score weighting</h3><label>Text similarity: <b id="wv">${s.w_sim}</b>% · Required-skill coverage: <b id="wk">${100-s.w_sim}</b>%</label><input id="w" type="range" min="0" max="100" value="${s.w_sim}" oninput="$('#wv').textContent=this.value;$('#wk').textContent=100-this.value">
<label>Shortlist threshold (match %, and minimum experience must be met)</label><input id="th" type="number" min="0" max="100" value="${s.shortlist}"><label>Skill list (comma separated)</label><textarea id="sl" rows="6">${E(s.skills.join(', '))}</textarea><br><br><button class="btn" onclick="saveSet()">Save settings</button><p class="sub">Skill list changes apply to resumes processed afterwards (use "Reprocess all"). Weights and threshold re-score immediately.</p></div>
<div class="card"><h3>Classifier</h3>TF-IDF + Logistic Regression<br>Accuracy ${D.metrics.accuracy} · F1 ${D.metrics.f1_macro}<p class="sub">${E(D.metrics.source||'')}</p><h3 style="margin-top:14px">Account</h3>Signed in as <b>${E(D.user)}</b> <button class="btn s" onclick="logout()">Logout</button></div></div>`}};
async function up(fs){if(!fs.length)return;const f=new FormData();[...fs].forEach(x=>f.append('files',x));await api('/api/upload',{method:'POST',body:f});toast(fs.length+' file(s) uploaded');await load();if(AUTO)procAll()}
async function del(i){await api('/api/resume/'+i,{method:'DELETE'});toast('Resume removed');load()}
async function view(i){const j=await api('/api/resume/'+i),sk=(j.skills||[]).filter(Boolean);let h=E(j.text);
if(sk.length)h=h.replace(new RegExp('(?<![\\w+#])('+sk.map(s=>escRe(E(s))).join('|')+')(?![\\w+#])','gi'),'<mark>$1</mark>');
$('#mb').innerHTML=`<h3>Extracted text <span class="kl">· detected skills highlighted</span></h3><pre style="white-space:pre-wrap;color:var(--m)">${h||'No text extracted (scanned PDF or unsupported file).'}</pre>`;$('#modal').style.display='grid'}
async function procAll(force){const todo=D.resumes.filter(r=>force||r.proc_status!='Processed'&&r.proc_status!='Skipped');if(!todo.length)return toast('Nothing to process',0);BUSY=1;const pa=$('#pa');if(pa)pa.disabled=true;let n=0;
for(const r of todo){try{await api('/api/process/'+r.id,{method:'POST'})}catch(e){break}n++;const b=$('#pb i');if(b)b.style.width=n/todo.length*100+'%'}BUSY=0;toast('Processed '+n+' resume(s)');load()}
async function jfile(f){if(!f)return;const b=new FormData();b.append('file',f);$('#jx').value=(await api('/api/jd/text',{method:'POST',body:b})).text;if(!$('#jt').value)$('#jt').value=f.name.replace(/\.\w+$/,'')}
async function saveJD(){if(!$('#jt').value||!$('#jx').value)return toast('Add a title and description',0);await post('/api/jd',{title:$('#jt').value,text:$('#jx').value,required:$('#jr').value,preferred:$('#jp').value,min_exp:$('#je').value});toast('Job saved and selected');load()}
async function selJD(i){await post('/api/jd/select/'+i);toast('Job selected · candidates re-scored');load()}
async function delJD(i){if(!confirm('Delete this job description?'))return;try{await api('/api/jd/'+i,{method:'DELETE'});toast('Job deleted');load()}catch(e){toast('Keep at least one job description',0)}}
async function saveSet(){await post('/api/settings',{w_sim:$('#w').value,shortlist:$('#th').value,skills:$('#sl').value});toast('Settings saved');load()}
async function decide(i,d){await post('/api/decision/'+i,{decision:d});toast(d?'Marked '+d:'Reset to automatic status');load()}
async function note(i){await post('/api/decision/'+i,{notes:$('#nt').value});toast('Note saved');load()}
function cmpAdd(i){CMP=[i,...CMP.filter(x=>x!=i)].slice(0,3);location.hash='compare'}
load();
</script></body></html>
